services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: airportapp
      POSTGRES_USER: airportapp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - airportapp_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airportapp -d airportapp"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airportdb-import:
    build:
      context: .
      dockerfile: Dockerfile.import
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: airportapp
      PGUSER: airportapp
      PGPASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
    volumes:
      - ../airport-db:/data:ro
      - ./scripts/import-airportdb.sh:/usr/local/bin/import-airportdb.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airportapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: airportapp:local
    ports:
      - "${AIRPORTAPP_PORT:-5164}:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DomainConnection: "Host=postgres;Port=5432;Database=airportapp;Username=airportapp;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__ApplicationConnection: "Host=postgres;Port=5432;Database=airportapp;Username=airportapp;Password=${POSTGRES_PASSWORD}"
      Ollama__BaseUrl: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      Ollama__Model: "${OLLAMA_MODEL:-llama3.2:1b}"
      EmailSettings__SmtpServer: "${EMAIL_SMTP_SERVER:-}"
      EmailSettings__SmtpPort: "${EMAIL_SMTP_PORT:-587}"
      EmailSettings__SenderName: "${EMAIL_SENDER_NAME:-}"
      EmailSettings__SenderEmail: "${EMAIL_SENDER_EMAIL:-}"
      EmailSettings__Password: "${EMAIL_PASSWORD:-}"
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      PayPal__ClientId: "${PAYPAL_CLIENT_ID:-}"
      PayPal__ClientSecret: "${PAYPAL_CLIENT_SECRET:-}"
      PayPal__BaseUrl: "${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}"
      PayPal__ReturnUrl: "${PAYPAL_RETURN_URL:-http://localhost:5164/Payment/Success}"
      PayPal__CancelUrl: "${PAYPAL_CANCEL_URL:-http://localhost:5164/Payment/Cancel}"
      PayPal__CurrencyCode: "${PAYPAL_CURRENCY_CODE:-USD}"
      PayPhone__Token: "${PAYPHONE_TOKEN:-}"
      PayPhone__StoreId: "${PAYPHONE_STORE_ID:-}"
    volumes:
      - airportapp_keys:/app/DataProtectionKeys
    depends_on:
      airportdb-import:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "10", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  airportapp_postgres:
  airportapp_keys:
