name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AirportApp.slnx
      - run: dotnet build AirportApp.slnx --configuration Release --no-restore
      - run: dotnet test AirportApp.slnx --configuration Release --no-build
      - run: dotnet list AirportApp/AirportApp.csproj package --vulnerable --include-transitive

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
